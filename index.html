<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e2023" media="(prefers-color-scheme: dark)">
  <title>Momentum 週間自律</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2300778a'/%3E%3Cpath d='M8 17l6 6 11-13' fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='square'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要內容</a>
  <div class="wrap">
    <header class="site-header">
      <p class="brand">
        <span class="brand-seal" aria-hidden="true">律</span>
        <span class="brand-name">Momentum</span>
        <span class="brand-sub">週間自律</span>
      </p>
      <div class="site-meta">
        <span id="clock"></span>
        <span class="status" id="save-status" data-state="loading"><span id="save-text">載入中…</span></span>
      </div>
    </header>
    <nav class="site-nav" id="nav" aria-label="主要導覽">
      <a href="#/today" data-v="today">今天</a>
      <a href="#/week" data-v="week">本週</a>
      <a href="#/review" data-v="review">回顧</a>
    </nav>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <ul role="list">
        <li>不補償</li>
        <li>不延後睡眠</li>
        <li>休息前先決定多久</li>
      </ul>
    </footer>
    <div class="sr-only" id="save-live" role="status"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
