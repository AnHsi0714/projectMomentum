<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Momentum 週間自律</title>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Momentum｜週間自律</h1>
      <div class="meta"><span id="clock"></span><span id="save-status"></span></div>
    </header>
    <nav id="nav">
      <button data-v="today" class="on">今天</button>
      <button data-v="week">本週</button>
      <button data-v="review">回顧</button>
    </nav>
    <main id="main"></main>
    <div class="foot">原則：不補償、不延後睡眠、休息前先決定多久。</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
